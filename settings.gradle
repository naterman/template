/*
 * The settings file is used to specify which projects to include in your build.
 * For more detailed information on multi-project builds, please refer to https://docs.gradle.org/9.6.1/userguide/multi_project_builds.html in the Gradle documentation.
 */
pluginManagement {
    includeBuild('build-logic')
}

plugins {
    id('org.gradle.toolchains.foojay-resolver-convention') version '1.0.0'
    id('io.github.ben-manes.versions.settings') version '0.61.0'
}

includeBuild('build-logic')
rootProject.name = 'GradleTemplate'

def projectGroups = [
    'client'  : [
        'style',
        'fxloader',
        'mapview',
        'app'
    ],
    'services': [
        'messaging',
        'mqtt',
        'routing',
        'repository',
        'server'
    ],
    'core'    : [
        'wire',
        'api',
        'framework',
        'model',
        'events',
        'local'
    ]
]

projectGroups.each { folder, modules ->
    modules.each { module ->
        include(module)
        project(":$module").projectDir = file("$folder/$module")
    }
}
