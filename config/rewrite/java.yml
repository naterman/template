type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.recipes.rewrite.OpenRewriteRecipeBestPractices
displayName: OpenRewrite recipe best practices
description: Best practices for OpenRewrite recipe development.
preconditions:
  # Refaster templates intentionally contain patterns that recipes would otherwise "fix"
  - org.openrewrite.java.search.DoesNotUseType:
      fullyQualifiedTypeName: com.google.errorprone.refaster.annotation.BeforeTemplate
      includeImplicit: true
recipeList:
  # Keep the Develocity build scan configuration consistent across OpenRewrite projects
  - org.openrewrite.gradle.plugins.SetDevelocityServer:
      server: "https://community.develocity.cloud/"
  - org.openrewrite.gradle.plugins.SetDevelocityProjectId:
      projectId: openrewrite
  - org.openrewrite.recipes.rewrite.InlineMethods
  - org.openrewrite.java.recipes.GenerateDeprecatedMethodRecipes
  - org.openrewrite.java.recipes.RemoveToBeRemoved
  - org.openrewrite.java.recipes.UpgradeTestsToJava21
  - org.openrewrite.java.recipes.ExamplesExtractor
  - org.openrewrite.java.OrderImports
  - org.openrewrite.java.RemoveUnusedImports
  - org.openrewrite.java.SimplifySingleElementAnnotation
  - org.openrewrite.java.format.EmptyNewlineAtEndOfFile
  - org.openrewrite.java.format.RemoveTrailingWhitespace

  # Opinionated, not included with Java best practices by default
  - org.openrewrite.staticanalysis.InlineVariable
  - org.openrewrite.staticanalysis.OperatorWrap:
      wrapOption: EOL
  - org.openrewrite.staticanalysis.RemoveUnusedLocalVariables
  - org.openrewrite.staticanalysis.RemoveUnusedPrivateFields
  - org.openrewrite.staticanalysis.RemoveUnusedPrivateMethods
  #- org.openrewrite.staticanalysis.UnnecessaryThrows
  - org.openrewrite.staticanalysis.UnwrapElseAfterReturn

  # Static analysis: bug prevention
  - org.openrewrite.staticanalysis.EqualsAvoidsNull
  - org.openrewrite.staticanalysis.MissingOverrideAnnotation
  - org.openrewrite.staticanalysis.ReplaceWeekYearWithYear
  - org.openrewrite.staticanalysis.RemoveHashCodeCallsFromArrayInstances
  - org.openrewrite.staticanalysis.RemoveToStringCallsFromArrayInstances
  - org.openrewrite.staticanalysis.UseObjectNotifyAll
  - org.openrewrite.staticanalysis.RemoveCallsToSystemGc
  - org.openrewrite.staticanalysis.RemoveCallsToObjectFinalize
  - org.openrewrite.staticanalysis.URLEqualsHashCodeRecipes
  # Static analysis: modernization and cleanup
  - org.openrewrite.staticanalysis.LambdaBlockToExpression
  - org.openrewrite.staticanalysis.ReplaceLambdaWithMethodReference
  - org.openrewrite.staticanalysis.UseDiamondOperator
  - org.openrewrite.staticanalysis.UnnecessaryParentheses
  - org.openrewrite.staticanalysis.RemoveRedundantNullCheckBeforeInstanceof
  - org.openrewrite.staticanalysis.ReplaceStringBuilderWithString
  - org.openrewrite.staticanalysis.UseCollectionInterfaces
  - org.openrewrite.staticanalysis.CompareEnumsWithEqualityOperator
  - org.openrewrite.staticanalysis.CombineSemanticallyEqualCatchBlocks
  - org.openrewrite.staticanalysis.UseStringReplace
  - org.openrewrite.staticanalysis.UseStandardCharset
  - org.openrewrite.staticanalysis.UseSystemLineSeparator
  - org.openrewrite.staticanalysis.RemoveRedundantTypeCast
  - org.openrewrite.staticanalysis.ReplaceStackWithDeque
  - org.openrewrite.staticanalysis.UseListSort
  - org.openrewrite.staticanalysis.EqualsToContentEquals

---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.recipes.JavaRecipeBestPractices
displayName: Java Recipe best practices
description: Best practices for Java recipe development.
preconditions:
  - org.openrewrite.java.search.FindTypes:
      fullyQualifiedTypeName: org.openrewrite.Recipe
      checkAssignability: true
recipeList:
  - org.openrewrite.java.recipes.BlankLinesAroundFieldsWithAnnotations
  - org.openrewrite.java.recipes.CorrectlySpacedDescriptions
  - org.openrewrite.java.recipes.ExecutionContextParameterName
  - org.openrewrite.java.recipes.IsLiteralNullRecipe
  - org.openrewrite.java.recipes.MissingOptionExample
  - org.openrewrite.java.recipes.NoMutableStaticFieldsInRecipes
  - org.openrewrite.java.recipes.RecipeEqualsAndHashCodeCallSuper
  - org.openrewrite.java.recipes.RecipeClassesShouldBePublic
  - org.openrewrite.java.recipes.RemoveImportBeforeAddImport
  - org.openrewrite.java.recipes.UseDisplayNameAndDescriptionFields
  - org.openrewrite.java.recipes.UseEstimatedEffortPerOccurrenceField
  - org.openrewrite.java.recipes.UseStringUtilsRecipes
  - org.openrewrite.java.recipes.UseTagsField
  - org.openrewrite.java.recipes.UseJavaTemplateStaticApply
  - org.openrewrite.java.recipes.UseTreeRandomId
  - org.openrewrite.java.recipes.UseVisitWithParentCursor
  - org.openrewrite.staticanalysis.RemoveSystemOutPrintln
  - org.openrewrite.java.recipes.RemoveNlsRewriteAnnotations
---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.recipes.RecipeTestingBestPractices
displayName: Recipe testing best practices
description: Best practices for testing recipes.
preconditions:
  - org.openrewrite.java.search.FindTypes:
      fullyQualifiedTypeName: org.openrewrite.test.RewriteTest
      checkAssignability: true
recipeList:
  - org.openrewrite.java.migrate.util.ReplaceStreamCollectWithToList:
      convertToList: true
  - org.openrewrite.java.recipes.ClasspathArgumentsOnePerLine
  - org.openrewrite.java.recipes.RewriteTestClassesShouldNotBePublic
  - org.openrewrite.java.recipes.SelectRecipeExamples
  - org.openrewrite.java.recipes.SingleDocumentExample
  - org.openrewrite.java.recipes.ReorderTestMethods
  - org.openrewrite.java.recipes.ReplaceNullWithDoesNotExist
  - org.openrewrite.java.recipes.SourceSpecTextBlockNewLine
  - org.openrewrite.java.recipes.SourceSpecTextBlockIndentation
  - org.openrewrite.java.recipes.UseRewriteTestDefaults

  # Local variable type inference — targeted, non-controversial uses
  # NOTE: UseVarForGenericsConstructors and UseVarForGenericMethodInvocations must run
  # before UseDiamondOperator, as they need the explicit type arguments on constructors
  # to safely infer the type for var. Diamond would erase that information.
  - org.openrewrite.java.migrate.lang.var.UseVarForTypeCast
  - org.openrewrite.java.migrate.lang.var.UseVarForConstructors
  - org.openrewrite.java.migrate.lang.var.UseVarForGenericsConstructors
  - org.openrewrite.java.migrate.lang.var.UseVarForGenericMethodInvocations
  - org.openrewrite.java.migrate.lang.var.UseVarForPrimitive
  # Prefer modern Java collection factories and utilities
  - org.openrewrite.java.migrate.util.JavaUtilAPIs
  # Markdown documentation comments (JEP 467, Java 23+)
  - org.openrewrite.java.migrate.lang.JavadocToMarkdownDocComment

  - org.openrewrite.java.testing.junit.JUnit6BestPractices
  - org.openrewrite.staticanalysis.NeedBraces
  - org.openrewrite.staticanalysis.ReorderAnnotations
  - org.openrewrite.java.UseStaticImport:
      methodPattern: 'org.openrewrite..Assertions *(..)'
  - org.openrewrite.java.UseStaticImport:
      methodPattern: 'org.openrewrite.test.RewriteTest *(..)'
  - org.openrewrite.java.UseStaticImport:
      methodPattern: 'org.openrewrite.test.SourceSpecs *(..)'

  - org.openrewrite.java.ChangeMethodTargetToStatic:
      methodPattern: java.util.Arrays asList(..)
      fullyQualifiedTargetTypeName: java.util.List
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: java.util.List asList(..)
      newMethodName: of
---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.java.recipes.RecipeNullabilityBestPractices
displayName: Recipe nullability best practices
description: Use JSpecify nullable annotations; drop Nonnull annotations; use `NullMarked` on `package-info.java` instead.
recipeList:
  - org.openrewrite.java.jspecify.MigrateFromOpenRewriteAnnotations
  - org.openrewrite.java.RemoveAnnotation:
      annotationPattern: '@org.jetbrains.annotations.NotNull'
  - org.openrewrite.java.RemoveAnnotation:
      annotationPattern: '@javax.annotation.Nonnull'
  - org.openrewrite.java.RemoveAnnotation:
      annotationPattern: '@jakarta.annotation.Nonnull'
  - org.openrewrite.java.jspecify.MigrateToJSpecify
  - org.openrewrite.staticanalysis.AnnotateNullableMethods
  - org.openrewrite.staticanalysis.NullableOnMethodReturnType
